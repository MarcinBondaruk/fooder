services:
  fooder:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000
      - API_KEY=dupadupa
      - SQLITE_DSN=/app/fooder.db
      - SERVER_PORT=8080
    volumes:
      - ./fooder.db:/app/fooder.db