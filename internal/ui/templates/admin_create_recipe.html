{{- define "admin_create_recipe" }}
<html lang="pl-PL">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=yes">

    <title>Fooder - Dodaj przepis</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 2rem;
        }

        form {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            /*margin: auto;*/
        }

        label {
            display: block;
            margin-top: 1rem;
            font-weight: bold;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.5rem;
            margin-top: 0.5rem;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            border: none;
            background-color: #0077cc;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .card {
            display: block;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 1rem;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Dodaj nowy przepis</h1>

    <form action="/admin/recipes/create" method="POST">
        <label for="name">Nazwa przepisu</label>
        <input type="text" id="name" name="name" required>

        <label for="description">Opis</label>
        <textarea id="description" name="description" rows="4" required></textarea>

        <label for="ingredients">Składniki (oddzielone przecinkami)</label>
        <input type="text" id="ingredients" name="ingredients" required>

        <button type="submit">Zapisz przepis</button>
    </form>
</div>
</body>
</html>
{{- end }}
